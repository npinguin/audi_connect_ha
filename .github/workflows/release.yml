# The upstream scheduled semantic-release workflow is intentionally disabled.
# Robotix releases require explicit validation and dispatch of
# .github/workflows/robotix-prerelease.yml on the main branch.
name: Upstream release disabled in Robotix fork

on:
  workflow_dispatch:

jobs:
  no_automatic_release:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Use Robotix Audi Connect — validated prerelease instead."
