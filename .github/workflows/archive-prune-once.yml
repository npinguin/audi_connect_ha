name: One-time archive and prune obsolete branches

on:
  push:
    branches:
      - fix/b10-release-ci-and-branch-cleanup

permissions:
  contents: write

jobs:
  archive_and_prune:
    if: github.repository == 'npinguin/audi_connect_ha' && github.ref == 'refs/heads/fix/b10-release-ci-and-branch-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Archive unique commits before deleting obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          # Preserve unique, unmerged tips as immutable archive tags.
          while read -r branch expected; do
            [ -n "$branch" ] || continue
            actual="$(gh api "repos/${repo}/git/ref/heads/${branch}" --jq '.object.sha')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Branch ${branch} moved; refusing cleanup"
              exit 1
            fi
          done <<'CHECKS'
          feat/diagnostics-d0.1 2895f719af01a84cd555da5e8f6e461620bc3f2e
          fix/q8-auth0-command-safety f059826d9fe08cfe91beff5e0bc3203b1b0bcb47
          CHECKS

          while read -r branch expected; do
            [ -n "$branch" ] || continue
            archive="refs/tags/archive/2026-11-10/${branch}"
            gh api -X POST "repos/${repo}/git/refs" -f "ref=${archive}" -f "sha=${expected}" >/dev/null
            echo "Archived ${branch} at ${archive}"
          done <<'ARCHIVES'
          feat/diagnostics-d0.1 2895f719af01a84cd555da5e8f6e461620bc3f2e
          fix/q8-auth0-command-safety f059826d9fe08cfe91beff5e0bc3203b1b0bcb47
          ARCHIVES

          for branch in feat/diagnostics-d0.1 fix/q8-auth0-command-safety; do
            gh api -X DELETE "repos/${repo}/git/refs/heads/${branch}"
            echo "Pruned archived branch ${branch}"
          done

      - name: Remove this temporary cleanup branch after preserving it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          branch="fix/b10-release-ci-and-branch-cleanup"
          current="$(gh api "repos/${repo}/git/ref/heads/${branch}" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::Cleanup branch moved; refusing deletion"
            exit 1
          fi
          gh api -X POST "repos/${repo}/git/refs" \
            -f "ref=refs/tags/archive/2026-11-10/ci-cleanup" \
            -f "sha=${GITHUB_SHA}" >/dev/null
          gh api -X DELETE "repos/${repo}/git/refs/heads/${branch}"
          echo "Archived and removed final temporary cleanup branch"
