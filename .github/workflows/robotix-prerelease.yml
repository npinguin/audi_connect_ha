name: Robotix Audi Connect — validated prerelease

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/audiconnect/**"
      - ".github/workflows/robotix-prerelease.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact integration manifest version, e.g. 2.5.3b1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate_and_publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Validate version and release source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          requested = os.environ.get("RELEASE_VERSION", "")
          actual = json.loads(Path("custom_components/audiconnect/manifest.json").read_text())["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+b\d+", actual), "Only explicit beta releases are supported"
          if requested:
              assert actual == requested, f"manifest={actual!r} requested={requested!r}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"VERSION={actual}\\n")
          PY

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest -q

      - name: Home Assistant hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS repository validation (metadata advisory for beta)
        id: hacs
        continue-on-error: true # Known external blocker: repository Issues setting
        uses: hacs/action@main
        with:
          category: integration

      - name: Report HACS metadata gate separately
        if: steps.hacs.outcome == 'failure'
        run: echo "::warning::HACS repository validation is NOT green. Check Issues enabled in the repository settings before production release."

      - name: Build install and optional HACS ZIP assets
        run: |
          mkdir -p dist
          (cd custom_components && zip -qr ../dist/audiconnect-ha-install.zip audiconnect)
          (cd custom_components/audiconnect && zip -qr ../../dist/audiconnect-hacs.zip .)
          unzip -l dist/audiconnect-ha-install.zip | grep -q 'audiconnect/manifest.json'
          unzip -l dist/audiconnect-hacs.zip | grep -q 'manifest.json'
          sha256sum dist/*.zip > dist/SHA256SUMS.txt

      - name: Create GitHub beta release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Beta v${VERSION} already exists; publishing skipped."
            exit 0
          fi
          gh release create "v${VERSION}" dist/*.zip dist/SHA256SUMS.txt \
            --target "${COMMIT}" \
            --prerelease \
            --title "Robotix Audi Connect v${VERSION} (test)" \
            --notes "Robotix test release from main. See docs/DIAGNOSTICS_D0.1.md and docs/ROBOTIX_RELEASE_WORKFLOW.md. Install only with backup and explicit test acceptance."
