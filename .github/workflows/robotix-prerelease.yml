name: Audi Connect — validated HACS test prerelease

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/audiconnect/**"
      - "hacs.json"
      - "tests/**"
      - "docs/COMMUNITY_TEST_RELEASE_*.md"
      - ".github/workflows/robotix-prerelease.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact integration manifest version, e.g. 2.5.3b1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate_and_publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Validate version and release source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          requested = os.environ.get("RELEASE_VERSION", "")
          actual = json.loads(Path("custom_components/audiconnect/manifest.json").read_text())["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+b\d+", actual), "Only explicit beta releases are supported"
          if requested:
              assert actual == requested, f"manifest={actual!r} requested={requested!r}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"VERSION={actual}\n")
          PY

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest -q

      - name: Home Assistant hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS repository validation (metadata advisory for beta)
        id: hacs
        continue-on-error: true # Advisory only for prereleases; investigate any failure
        uses: hacs/action@main
        with:
          category: integration

      - name: Report HACS metadata gate separately
        if: steps.hacs.outcome == 'failure'
        run: echo "::warning::HACS repository validation is NOT green. Check Issues enabled in the repository settings before production release."

      - name: Build HACS ZIP assets and verify metadata
        run: |
          mkdir -p dist
          (cd custom_components && zip -qr ../dist/audiconnect-ha-install.zip audiconnect)
          (cd custom_components/audiconnect && zip -qr ../../dist/audiconnect-hacs.zip .)
          unzip -l dist/audiconnect-ha-install.zip | grep -q 'audiconnect/manifest.json'
          unzip -l dist/audiconnect-hacs.zip | grep -q 'manifest.json'
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("hacs.json").read_text())
          assert data.get("zip_release") is True, "HACS must download the release ZIP"
          assert data.get("filename") == "audiconnect-hacs.zip", "HACS ZIP metadata drift"
          assert Path("dist", data["filename"]).is_file(), "HACS ZIP asset missing"
          assert data.get("hide_default_branch") is True, "Avoid installing default master branch"
          PY
          sha256sum dist/*.zip > dist/SHA256SUMS.txt

      - name: Create GitHub beta release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Beta v${VERSION} already exists; publishing skipped."
          else
            gh release create "v${VERSION}" dist/*.zip dist/SHA256SUMS.txt \
              --target "${COMMIT}" \
              --prerelease \
              --title "Audi Connect v${VERSION} (test)" \
              --notes "Community test candidate. Back up Home Assistant before installing. Validate vehicle controls and compatibility before upstream submission."
          fi

      - name: Remove obsolete branches after successful b10 release
        if: env.VERSION == '2.5.3b10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This one-time list is pinned to reviewed branch tips. Any branch
          # that moved is left untouched. Preserve main, master, and work
          # with unmerged commits until separately reviewed.
          while read -r branch expected; do
            [ -n "$branch" ] || continue
            current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null)" || {
              echo "::warning::Cannot read branch ${branch}; skipping"
              continue
            }
            if [ "$current" != "$expected" ]; then
              echo "::warning::Branch ${branch} has moved; preserving"
              continue
            fi
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              echo "Removed merged or superseded branch ${branch}"
            else
              echo "::warning::Deletion refused for ${branch}; check branch protection"
            fi
          done <<'BRANCHES'
          feat/q8-comprehensive-b7 85243d1893a71f82511b9f506ce0f93e8b6ccbdd
          feat/q8-product-maturity-b8 c9c4348f98098a9281add20d6778f86979f58361
          fix/q8-lock-model-parktime 40681e05538e61ab07a34324ad46991eb9ac9eb9
          fix/q8-modern-remote-commands 14090a403c40432ca79d50dac982ee14c91ef013
          fix/remove-duplicate-climate-buttons cfce618505b46e30bcf0279d365c0667a51c5f39
          fix/upstream-clean-release a1078f2c5cc991bc031b03af491dd1444d19a95a
          test/community-fix-2.5.3b9 955cd6eb6b8d3bad428521be31a5044254f3a6ae
          upstream/community-contribution-prep 45c6a343f6d80be7827cd2f69a8686fb386bfb8f
          BRANCHES
