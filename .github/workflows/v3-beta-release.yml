name: V3 Clean Beta — validate and publish

on:
  push:
    branches: [feature/v3-clean-discovery]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Publish a code-complete test prerelease after static parity sign-off"
        required: true
        type: choice
        default: do-not-publish
        options: [do-not-publish, publish-code-complete-test]

permissions:
  contents: read

concurrency:
  group: audi-v3-beta-release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.ref == 'refs/heads/feature/v3-clean-discovery' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
      (github.event_name == 'pull_request' && github.head_ref == 'feature/v3-clean-discovery' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2026.7.0"
            package: false
          - ha: "2026.11.1"
            package: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate manifest and release metadata
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          manifest = json.loads(Path("custom_components/audiconnect/manifest.json").read_text())
          version = manifest["version"]
          assert re.fullmatch(r"3\.0\.0b[1-9][0-9]*", version)
          assert manifest["domain"] == "audiconnect"
          assert version in Path("readme.md").read_text()
          assert Path(f"docs/V3_RELEASE_NOTES_{version}.md").is_file()
          full = json.loads(Path("custom_components/audiconnect/v3/full_catalog.json").read_text())
          assert full["schema_version"] == 1
          assert {"climate", "charging", "vehicle_status", "access", "service", "mobility"} <= set(full["capabilities"])
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"VERSION={version}\n")
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install target HA and test dependencies
        run: |
          sed 's/^homeassistant==.*/homeassistant==${{ matrix.ha }}/' requirements-test.txt > "$RUNNER_TEMP/audi-test.txt"
          pip install -r "$RUNNER_TEMP/audi-test.txt"

      - name: Compile and run all regression tests
        run: |
          python -m compileall -q custom_components/audiconnect tests
          pytest -q

      - name: Development Workbench UI regression
        if: matrix.package
        run: |
          node --check custom_components/audiconnect/v3/frontend/panel.js
          node --test tests/test_v3_workbench_ui.mjs

      - name: Home Assistant hassfest
        if: matrix.package
        uses: home-assistant/actions/hassfest@master

      - name: HACS integration validation
        if: matrix.package
        uses: hacs/action@main
        with:
          category: integration

      - name: Package only the integration
        if: matrix.package
        run: |
          cd custom_components
          zip -qr "../audi_connect_v3_${VERSION}.zip" audiconnect -x "*/__pycache__/*" "*.pyc"
          cd ..
          test -s "audi_connect_v3_${VERSION}.zip"
          sha256sum "audi_connect_v3_${VERSION}.zip" > "SHA256SUMS_V3_${VERSION}.txt"

      - name: Upload validated package
        if: matrix.package
        uses: actions/upload-artifact@v4
        with:
          name: audi-connect-v3-${{ env.VERSION }}-validated
          path: |
            audi_connect_v3_${{ env.VERSION }}.zip
            SHA256SUMS_V3_${{ env.VERSION }}.txt
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    if: >-
      github.repository == 'npinguin/audi_connect_ha' &&
      github.ref == 'refs/heads/feature/v3-clean-discovery' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'publish-code-complete-test') ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(test): publish ')))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Validate publication authorization and gates
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          version = json.loads(Path("custom_components/audiconnect/manifest.json").read_text())["version"]
          match = re.fullmatch(r"3\.0\.0b([1-9][0-9]*)", version)
          assert match
          parity = json.loads(Path("docs/V2_V3_PARITY_BASELINE.json").read_text())["release_gate"]
          completeness = json.loads(Path("governance/V3_COMPLETENESS_GATE.json").read_text())
          pending = [item for item in completeness["items"] if item["blocks_hacs"] and item["status"] != "closed"]
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              assert parity["v3_static_parity_proven"] is True
              assert parity["test_release_code_complete"] is True
              assert completeness["hacs_ready"] is True and not pending
          else:
              authorization_path = Path(f"governance/B{match.group(1)}_EXPERIMENTAL_TEST_RELEASE.json")
              assert authorization_path.is_file(), "No version-bound experimental authorization"
              authorization = json.loads(authorization_path.read_text())
              assert authorization["version"] == version
              assert authorization["classification"] == "experimental_hacs_test_only"
              assert authorization["normal_release_gates_unchanged"] is True
              assert authorization["stable_promotion_allowed"] is False
              assert authorization["static_parity_claimed"] is False
              assert parity["v3_static_parity_proven"] is False
              assert parity["test_release_code_complete"] is False
              assert parity["full_release_allowed"] is False
              assert completeness["hacs_ready"] is False and completeness["upstream_ready"] is False
              intent = f"release(test): publish {version} HACS prerelease"
              assert authorization["release_intent"] == intent
              assert subprocess.check_output(["git", "log", "-1", "--format=%B"], text=True).strip() == intent
              assert authorization["base_commit"] == subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
              exception = authorization["completeness_exception"]
              assert exception["version"] == version
              assert exception["upstream_gate_override"] is False
              assert exception["allows_open_implementation_blockers"] is False
              assert exception["requires_status"] == "implemented_pending_validation"
              assert {item["id"] for item in pending} == set(exception["pending_hacs_gate_ids"])
              assert all(item["status"] == "implemented_pending_validation" and item.get("implementation_evidence") for item in pending)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"VERSION={version}\n")
          PY

      - uses: actions/download-artifact@v4
        with:
          name: audi-connect-v3-${{ env.VERSION }}-validated

      - name: Verify package integrity and publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c "SHA256SUMS_V3_${VERSION}.txt"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1 || gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Refusing to replace existing tag or release $VERSION." >&2
            exit 1
          fi
          gh release create "$VERSION" "audi_connect_v3_${VERSION}.zip" "SHA256SUMS_V3_${VERSION}.txt" \
            --target "$GITHUB_SHA" \
            --title "Audi Connect $VERSION — integrated HACS test" \
            --notes-file "docs/V3_RELEASE_NOTES_${VERSION}.md" \
            --prerelease --latest=false
