name: V3 Clean Beta — validate and publish

on:
  push:
    branches:
      - feature/v3-clean-discovery
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Publish a code-complete test prerelease after static parity sign-off"
        required: true
        type: choice
        default: do-not-publish
        options:
          - do-not-publish
          - publish-code-complete-test

permissions:
  contents: read

concurrency:
  group: audi-v3-beta-release
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.ref == 'refs/heads/feature/v3-clean-discovery' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
      (github.event_name == 'pull_request' && github.head_ref == 'feature/v3-clean-discovery' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Match beta manifest, README and documentation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = "3.0.0b13"
          manifest = json.loads(Path("custom_components/audiconnect/manifest.json").read_text())
          assert manifest["domain"] == "audiconnect"
          assert manifest["version"] == expected
          for obsolete in ("climate.py", "climate.json", "coordinator.py"):
              assert not (Path("custom_components/audiconnect/v3") / obsolete).exists()
          full = json.loads(Path("custom_components/audiconnect/v3/full_catalog.json").read_text())
          assert full["schema_version"] == 1
          assert {"climate", "charging", "vehicle_status", "access", "service", "mobility"} <= set(full["capabilities"])
          assert {"cariad", "mbb"} <= set(full["api_families"])
          assert "class GraphQLExecutor:" in Path("custom_components/audiconnect/v3/family_executors.py").read_text()
          assert Path("docs/V3_ARCHITECTURE.md").is_file()
          assert Path("docs/V3_CONFIGURATION.md").is_file()
          assert Path("docs/V3_TEST_MATRIX.md").is_file()
          assert Path(f"docs/V3_RELEASE_NOTES_{expected}.md").is_file()
          print(f"Manifest / catalog / documentation: {expected}")
          PY

      - name: Compile all integration code and tests
        run: python -m compileall -q custom_components/audiconnect tests

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: All regression tests
        run: pytest -q

      - name: Development Workbench UI selection regression
        run: |
          node --check custom_components/audiconnect/v3/frontend/panel.js
          node --test tests/test_v3_workbench_ui.mjs

      - name: Home Assistant hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS integration validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Package only the HA integration
        run: |
          cd custom_components
          zip -qr "../audi_connect_v3_3.0.0b13.zip" audiconnect -x "*/__pycache__/*" "*.pyc"
          cd ..
          test -s audi_connect_v3_3.0.0b13.zip
          sha256sum audi_connect_v3_3.0.0b13.zip > SHA256SUMS_V3_3.0.0b13.txt

      - name: Upload manual-install test artifact
        uses: actions/upload-artifact@v4
        with:
          name: audi-connect-v3-3.0.0b13-validated
          path: |
            audi_connect_v3_3.0.0b13.zip
            SHA256SUMS_V3_3.0.0b13.txt
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    # Physical Q8 acceptance requires an installable test release. Stable promotion is separate.
    # Version-bound one-time experimental test authorization.
    if: >-
      github.repository == 'npinguin/audi_connect_ha' &&
      github.ref == 'refs/heads/feature/v3-clean-discovery' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'publish-code-complete-test') ||
      (github.event_name == 'push' && github.event.head_commit.message == 'release(test): publish 3.0.0b13 HACS prerelease'))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/download-artifact@v4
        with:
          name: audi-connect-v3-3.0.0b13-validated

      - name: Reject test release without code-complete V2 parity
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path("docs/V2_V3_PARITY_BASELINE.json").read_text())
          gate = baseline["release_gate"]
          assert gate["v3_static_parity_proven"] is True, "Static V2 parity not proven"
          assert gate.get("test_release_code_complete") is True, "Code-complete test sign-off missing"
          # Q8 physical and rollback evidence belong to the stable release gate.
          PY

      - name: Validate one-time experimental test authorization
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          authorization = json.loads(Path("governance/B13_EXPERIMENTAL_TEST_RELEASE.json").read_text())
          manifest = json.loads(Path("custom_components/audiconnect/manifest.json").read_text())
          gate = json.loads(Path("docs/V2_V3_PARITY_BASELINE.json").read_text())["release_gate"]
          assert authorization["version"] == manifest["version"] == "3.0.0b13"
          assert authorization["classification"] == "experimental_hacs_test_only"
          assert authorization["base_commit"] == "bf2aa72e1e80367261477fca0fe4dffb877f81b5"
          assert authorization["stable_promotion_allowed"] is False
          assert authorization["static_parity_claimed"] is False
          assert gate["v3_static_parity_proven"] is False
          assert gate["test_release_code_complete"] is False
          assert gate["full_release_allowed"] is False
          completeness = json.loads(Path("governance/V3_COMPLETENESS_GATE.json").read_text())
          exception = authorization["completeness_exception"]
          pending = [item for item in completeness["items"] if item["blocks_hacs"] and item["status"] != "closed"]
          assert completeness["hacs_ready"] is False and completeness["upstream_ready"] is False
          assert exception["version"] == manifest["version"]
          assert exception["upstream_gate_override"] is False
          assert exception["allows_open_implementation_blockers"] is False
          assert exception["requires_status"] == "implemented_pending_validation"
          assert {item["id"] for item in pending} == set(exception["pending_hacs_gate_ids"])
          assert all(item["status"] == "implemented_pending_validation" and item.get("implementation_evidence") for item in pending)
          PY
          test "$(git rev-parse HEAD^)" = "bf2aa72e1e80367261477fca0fe4dffb877f81b5"

      - name: Prevent prerelease replacement
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/3.0.0b13" >/dev/null 2>&1; then
            echo "Refusing to replace already-published 3.0.0b13." >&2
            exit 1
          fi
          if gh release view 3.0.0b13 >/dev/null 2>&1; then
            echo "Refusing to replace existing prerelease 3.0.0b13." >&2
            exit 1
          fi

      - name: Publish exact tested SHA as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 3.0.0b13 audi_connect_v3_3.0.0b13.zip SHA256SUMS_V3_3.0.0b13.txt \
            --target "${GITHUB_SHA}" \
            --title "Audi Connect 3.0.0b13 — V3 automatic discovery, trip history and telemetry (experimental HACS test)" \
            --notes-file docs/V3_RELEASE_NOTES_3.0.0b13.md \
            --prerelease --latest=false
