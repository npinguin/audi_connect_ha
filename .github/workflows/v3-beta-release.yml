name: V3 Climate Beta — validate and publish

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Explicit confirmation to publish the tested V3 beta"
        required: true
        type: choice
        default: do-not-publish
        options:
          - do-not-publish
          - publish-v3-3.0.0b1

permissions:
  contents: read

concurrency:
  group: audi-v3-beta-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/feature/v3-climate-pilot' && inputs.confirmation == 'publish-v3-3.0.0b1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Match beta manifest, README and documentation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = "3.0.0b1"
          manifest = json.loads(Path("custom_components/audiconnect/manifest.json").read_text())
          model = json.loads(Path("custom_components/audiconnect/v3/climate.json").read_text())
          assert manifest["domain"] == "audiconnect"
          assert manifest["version"] == expected
          assert list(model["capabilities"]) == ["climate"]
          assert Path("docs/V3_ARCHITECTURE.md").is_file()
          assert Path("docs/V3_CONFIGURATION.md").is_file()
          assert Path("docs/V3_TEST_MATRIX.md").is_file()
          assert Path(f"docs/V3_RELEASE_NOTES_{expected}.md").is_file()
          print(f"Manifest / catalog / documentation: {expected}")
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: All regression tests
        run: pytest -q

      - name: Home Assistant hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS integration validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Package only the HA integration
        run: |
          cd custom_components
          zip -qr "../audi_connect_v3_3.0.0b1.zip" audiconnect
          cd ..
          test -s audi_connect_v3_3.0.0b1.zip

      - name: Upload manual-install test artifact
        uses: actions/upload-artifact@v4
        with:
          name: audi-connect-v3-3.0.0b1-validated
          path: audi_connect_v3_3.0.0b1.zip
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: audi-connect-v3-3.0.0b1-validated

      - name: Refuse to replace an existing beta tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/3.0.0b1" >/dev/null 2>&1; then
            echo "Tag 3.0.0b1 exists: no silent replacement." >&2
            exit 1
          fi
          if gh release view 3.0.0b1 >/dev/null 2>&1; then
            echo "Release 3.0.0b1 exists: no silent replacement." >&2
            exit 1
          fi

      - name: Publish exact tested SHA as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 3.0.0b1 audi_connect_v3_3.0.0b1.zip \
            --target "${GITHUB_SHA}" \
            --title "Audi Connect 3.0.0b1 — V3 Climate (experimental)" \
            --notes-file docs/V3_RELEASE_NOTES_3.0.0b1.md \
            --prerelease \
            --verify-tag=false
