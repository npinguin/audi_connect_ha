---
# Describes the format for available services for audiconnect

probe_api_paths:
  name: Probe known read-only Audi API paths
  description: >
    On-demand, rate-limited validation of eight known CARIAD GET endpoints for
    a single vehicle. No remote control actions. Results appear in the next
    Home Assistant Download diagnostics export. Only run when investigating
    missing vehicle data. Extended mode adds four experimental GET-only checks,
    including climate timers, measurements, inspection and trip statistics.
    Re-running with a different mode within 15 minutes is rejected.
    Restore mode offers two independent groups. "Trip data" tests the three
    previously reachable routes. "Vehicle health" tests 12V battery support,
    tyre pressure and warnings. The two previously rejected tripstatistics
    routes are excluded from routine scans. Use the dedicated Probe vehicle
    health or Probe trip data actions for simple testing without extra toggles.
    Extended and restore cannot both be enabled. Each selected group uses at
    most three GET requests per explicit invocation, including when Audi omits
    the API budget. If a budget is known it must start at 20 or more remaining
    calls, with a reserve of 12. The existing 15-minute per-vehicle cooldown
    applies across groups. No background retries are scheduled.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    extended:
      selector:
        boolean:
    restore:
      name: Legacy restore mode (advanced)
      description: >
        Turn the switch ON (blue) as well as enabling the field checkbox.
        For simpler testing use the dedicated Probe vehicle health or
        Probe trip data action instead.
      selector:
        boolean:
    restore_group:
      name: Restore probe group
      description: >
        Only used when Restore is enabled. Choose trips or vehicle health.
      selector:
        select:
          options:
            - label: Trip data (3 requests)
              value: trips
            - label: Vehicle health (12V, tyres, warnings; 3 requests)
              value: vehicle_health

probe_vehicle_health:
  name: Probe Audi vehicle health (read-only)
  description: >
    Run exactly three opt-in GET-only probes for 12V battery support, tyre
    pressure and vehicle health warnings. No restore switch or group selection
    is needed. No vehicle control actions or background requests. Shares the
    15-minute per-vehicle cooldown and Audi rate-limit safeguards with the
    other diagnostic probes. Download Audi Connect diagnostics to see results.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect

probe_trip_data:
  name: Probe Audi trip endpoints (read-only)
  description: >
    Check three modern CARIAD trip routes using bounded GET requests. This
    only checks reachability; it does not update trip sensor values. To read
    validated trip data into existing sensors, use Read modern Audi trip data.
    Shares the 15-minute cooldown and API-budget safeguards.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect

refresh_trip_data:
  name: Read modern Audi trip data
  description: >
    Explicit, read-only CARIAD shortterm, longterm and last-trip GET requests.
    Attempts to restore existing trip sensors only when real data has a
    timestamp and supported measurement fields. No automatic polling, writes,
    location history or guessed consumption units. Maximum three requests
    with a shared 15-minute cooldown and an API quota guard.
    Inspect the sanitized diagnostics for schema outcomes.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect

set_local_dealer:
  name: Set local dealer and service information
  description: >-
    Optional details kept locally in Home Assistant. No Audi API requests.
    Fields not supplied keep their previous values. Empty text removes a field.
    Clear removes the whole local record for this vehicle.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    dealer_name:
      selector:
        text:
    dealer_city:
      selector:
        text:
    dealer_address:
      selector:
        text:
    dealer_phone:
      selector:
        text:
    dealer_website:
      selector:
        text:
          type: url
    next_service_date:
      selector:
        date:
    warranty_expiry:
      selector:
        date:
    clear:
      selector:
        boolean:

refresh_vehicle_data:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect

execute_vehicle_action:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    action:
      required: true
      example: "lock"
      selector:
        select:
          translation_key: vehicle_actions
          options:
            - lock
            - unlock
            - start_climatisation
            - stop_climatisation
            - start_charger
            - start_timed_charger
            - stop_charger
            - start_preheater
            - stop_preheater
            - start_window_heating
            - stop_window_heating

start_climate_control:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    temp_f:
      selector:
        number:
          min: 59
          max: 85
    temp_c:
      selector:
        number:
          min: 15
          max: 30
    glass_heating:
      selector:
        boolean:
    seat_fl:
      selector:
        boolean:
    seat_fr:
      selector:
        boolean:
    seat_rl:
      selector:
        boolean:
    seat_rr:
      selector:
        boolean:
    climatisation_at_unlock:
      selector:
        boolean:
    climatisation_mode:
      example: "comfort"
      selector:
        select:
          options:
            - comfort
            - economy

start_auxiliary_heating:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    duration:
      selector:
        number:
          min: 10
          max: 60
          step: 10
          unit_of_measurement: "minutes"

set_location_charge_target:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    profile_id:
      example: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
    target_soc:
      required: true
      example: 80
      selector:
        number:
          min: 20
          max: 100
          step: 5
          unit_of_measurement: "%"

set_charge_mode:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    charge_mode:
      required: true
      example: "manual"
      selector:
        select:
          options:
            - manual
            - timer

set_target_soc:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    target_soc:
      required: true
      example: 80
      selector:
        number:
          min: 20
          max: 100
          step: 5
          unit_of_measurement: "%"

start_engine:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect

stop_engine:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
